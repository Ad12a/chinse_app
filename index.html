<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> Play know </title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header><h1>Play Know</h1><div class="stars" id="stars" aria-live="polite">⭐ 0</div></header>
<p class="sub">Tap a picture to hear its name. Type anything to hear it in any language.</p>

<section>
<h2>Sound board</h2>
<div class="bar">
<select id="blang" aria-label="Language for sound board"></select>
<select id="bvoice" aria-label="Voice style"><option value="1.8">Baby voice</option><option value="1">Normal voice</option><option value="0.7">Deep voice</option></select>
</div>
<div class="grid" id="grid"></div>
<div class="bar" style="margin-top:14px">
<button class="btn" id="lull">🎵 Play lullaby</button>
<button class="btn alt" id="rand">🎲 Surprise me</button>
</div>
</section>

<section>
<h2>Chinese words (HSK)</h2>
<div class="bar">
<select id="wlevel" aria-label="HSK level"><option value="all">All levels</option></select>
<select id="wmode" aria-label="What to say"><option value="both">Say Chinese + English</option><option value="en">Say English only</option><option value="zh">Say Chinese only</option></select>
</div>
<input id="wsearch" type="search" placeholder="Search Chinese, pinyin or English…" aria-label="Search words">
<div class="wpanel" aria-live="polite">
<div class="wh" id="wh">👆</div>
<div id="wp" class="wp">Tap a word below</div>
<div class="we" id="we"></div>
<div class="wlv" id="wlv"></div>
<div class="bar"><button class="btn alt" id="wzh" type="button">🔊 Chinese</button><button class="btn alt" id="wen" type="button">🔊 English</button><button class="btn" id="wrand" type="button">🎲 Random</button></div>
</div>
<div class="wcount" id="wcount"></div>
<div class="words" id="wgrid"></div>
<div class="pager"><button class="btn alt" id="wprev" type="button">◀ Previous</button><span class="wpage" id="wpage" aria-live="polite"></span><button class="btn" id="wnext" type="button">Next ▶</button></div>
</section>

<section>
<h2>Type and listen</h2>
<div class="chips" id="chips"></div>
<textarea id="txt" placeholder="Type or paste text in any language…" aria-label="Text to speak"></textarea>
<div class="bar" style="margin-top:10px">
<select id="lang" aria-label="Language"></select>
<select id="voice" aria-label="Voice"></select>
</div>
<div class="range"><span>Speed</span><input id="rate" type="range" min="0.5" max="1.5" step="0.1" value="1" aria-label="Speed"></div>
<div class="range"><span>Pitch</span><input id="pitch" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="Pitch"></div>
<div class="bar" style="margin-top:12px">
<button class="btn" id="speak">▶ Speak</button><button class="btn alt" id="stop">■ Stop</button><button class="btn alt" id="clearTxt" type="button">🗑 Clear</button>
</div>
<div class="reader" id="reader" aria-live="polite">Words light up here while they are spoken.</div>
<div id="msg" role="status"></div>
</section>

<section>
<div class="head"><h2>Recently spoken</h2><button class="chip" id="clearHist" type="button" aria-label="Clear recently spoken list">🗑 Clear</button></div>
<div class="hist" id="hist"><span style="color:var(--muted)">Nothing yet.</span></div>
</section>
</main>
<script src="data.js"></script>
<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>
<script src="script.js"></script>
</body>
</html>
